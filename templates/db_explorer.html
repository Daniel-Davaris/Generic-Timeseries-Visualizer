<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Explorer – ALPHA-9</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><polyline points='4,24 10,14 16,18 22,8 28,16' stroke='%2358a6ff' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>">
  <style>
    :root { --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
            --text-primary: #e6edf3; --text-secondary: #8b949e; --text-muted: #6e7681;
            --border: #30363d; --accent: #58a6ff; --accent-green: #3fb950; --accent-red: #f85149; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }

    .top-bar { position: sticky; top: 0; z-index: 100; background: var(--bg-secondary);
               border-bottom: 1px solid var(--border);
               display: flex; align-items: center; gap: 12px;
               padding: 2px 8px; height: 24px; }
    .top-bar .logo-btn { background: none; border: none; cursor: pointer; padding: 0; display: flex;
                         align-items: center; border-radius: 6px; transition: transform 0.15s; }
    .top-bar .logo-btn:hover { transform: scale(1.1); }
    .top-bar h1 { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
    .top-bar .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-left: auto;
                         text-transform: uppercase; letter-spacing: 1px; }

    .layout { display: flex; height: calc(100vh - 25px); }
    .sidebar { width: 240px; min-width: 120px; max-width: 600px; border-right: 1px solid var(--border);
               overflow-y: auto; background: var(--bg-secondary); padding: 8px; flex-shrink: 0;
               position: relative; }
    .sidebar-resize { position: absolute; top: 0; right: -3px; width: 8px; height: 100%;
                      cursor: col-resize; z-index: 10; }
    .sidebar-resize:hover, .sidebar-resize.active { background: var(--accent); opacity: 0.3; }
    .sidebar h3 { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted);
                  letter-spacing: 0.5px; margin-bottom: 6px; padding: 4px; }
    .table-item { padding: 6px 8px; border-radius: 4px; cursor: pointer; display: flex;
                  justify-content: space-between; align-items: center; font-size: 0.8rem;
                  color: var(--text-secondary); transition: all 0.1s; position: relative; }
    .table-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .table-item.active { background: var(--bg-tertiary); color: var(--accent); border-left: 2px solid var(--accent); }
    .table-item .row-count { font-size: 0.65rem; color: var(--text-muted); background: var(--bg-primary);
                             padding: 1px 5px; border-radius: 8px; }
    .table-item .tbl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .table-item .move-btn { display: none; background: none; border: none; color: var(--text-muted);
                            cursor: pointer; font-size: 0.75rem; padding: 0 4px; flex-shrink: 0; }
    .table-item:hover .move-btn { display: inline; }
    .table-item .move-btn:hover { color: var(--accent); }
    .table-item .del-btn { display: none; background: none; border: none; color: var(--text-muted);
                           cursor: pointer; font-size: 0.75rem; padding: 0 4px; flex-shrink: 0; }
    .table-item:hover .del-btn { display: inline; }
    .table-item .del-btn:hover { color: #f85149; }

    .group-header { display: flex; align-items: center; gap: 5px; padding: 6px 4px 3px;
                    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px;
                    color: var(--text-muted); cursor: pointer; user-select: none; margin-top: 6px; }
    .group-header:hover { color: var(--text-primary); }
    .group-header .arrow { font-size: 0.6rem; transition: transform 0.15s; }
    .group-header.collapsed .arrow { transform: rotate(-90deg); }
    .group-header .g-count { margin-left: auto; font-size: 0.65rem; }
    .group-body.hidden { display: none; }

    .group-menu { position: fixed; z-index: 300; background: var(--bg-secondary);
                  border: 1px solid var(--border); border-radius: 6px; padding: 4px;
                  min-width: 160px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
    .group-menu .gm-item { padding: 6px 10px; font-size: 0.78rem; color: var(--text-secondary);
                           border-radius: 4px; cursor: pointer; }
    .group-menu .gm-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .group-menu .gm-sep { border-top: 1px solid var(--border); margin: 4px 0; }

    .main-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg-secondary); }
    .tab { padding: 8px 16px; font-size: 0.8rem; color: var(--text-muted); cursor: pointer;
           border-bottom: 2px solid transparent; transition: all 0.15s; }
    .tab:hover { color: var(--text-primary); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { flex: 1; overflow: auto; padding: 12px; display: none; }
    .tab-content.active { display: block; }

    /* Schema tab */
    .schema-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .schema-table th { text-align: left; padding: 6px 10px; background: var(--bg-tertiary);
                       color: var(--text-secondary); font-weight: 600; border-bottom: 1px solid var(--border); }
    .schema-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
    .schema-table .type { color: var(--accent); font-family: monospace; font-size: 0.75rem; }

    /* Data table */
    .data-wrap { overflow: auto; max-height: calc(100vh - 180px); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; white-space: nowrap; }
    .data-table th { position: sticky; top: 0; padding: 5px 8px; background: var(--bg-tertiary);
                     color: var(--text-secondary); font-weight: 600; border-bottom: 1px solid var(--border);
                     text-align: left; }
    .data-table td { padding: 4px 8px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
    .data-table tr:hover td { background: var(--bg-tertiary); }

    /* SQL Editor */
    .sql-editor { display: flex; flex-direction: column; height: 100%; }
    .sql-input { width: 100%; min-height: 120px; padding: 12px; font-family: 'Fira Code', monospace;
                 font-size: 0.85rem; background: var(--bg-primary); color: var(--text-primary);
                 border: 1px solid var(--border); border-radius: 6px; resize: vertical; outline: none; }
    .sql-input:focus { border-color: var(--accent); }
    .sql-actions { display: flex; gap: 8px; margin: 8px 0; align-items: center; }
    .btn { padding: 6px 14px; font-size: 0.8rem; border-radius: 4px; cursor: pointer;
           border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-primary);
           transition: all 0.15s; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-run { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    .btn-run:hover { background: #79c0ff; }
    .sql-status { font-size: 0.75rem; color: var(--text-muted); }
    .sql-error { color: var(--accent-red); font-size: 0.8rem; padding: 8px; background: #1a0000;
                 border: 1px solid var(--accent-red); border-radius: 4px; margin-top: 8px; }
    .sql-results { flex: 1; overflow: auto; margin-top: 8px; }

    /* Export button */
    .export-btn { position: absolute; top: 8px; right: 8px; }

    .empty-state { display: flex; align-items: center; justify-content: center; height: 100%;
                   color: var(--text-muted); font-size: 0.9rem; }

    /* Upload modal */
    .btn-upload { width: 100%; margin-bottom: 8px; text-align: center; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
                     z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px;
             padding: 20px; width: 420px; max-width: 90vw; }
    .modal h2 { font-size: 0.95rem; margin-bottom: 14px; }
    .modal label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin: 10px 0 4px; }
    .modal input[type="text"], .modal select {
      width: 100%; padding: 7px 10px; font-size: 0.8rem; background: var(--bg-primary);
      color: var(--text-primary); border: 1px solid var(--border); border-radius: 4px; outline: none; }
    .modal input[type="text"]:focus, .modal select:focus { border-color: var(--accent); }
    .drop-zone { border: 1px dashed var(--border); border-radius: 6px; padding: 18px;
                 text-align: center; font-size: 0.8rem; color: var(--text-muted); cursor: pointer;
                 transition: all 0.15s; }
    .drop-zone:hover, .drop-zone.drag { border-color: var(--accent); color: var(--accent); }
    .drop-zone.has-file { border-style: solid; border-color: var(--accent-green); color: var(--accent-green); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .upload-status { font-size: 0.75rem; margin-top: 10px; }
    .upload-status.err { color: var(--accent-red); }
    .upload-status.ok { color: var(--accent-green); }
    .progress-wrap { display: none; margin-top: 12px; }
    .progress-wrap.visible { display: block; }
    .progress-track { height: 8px; background: var(--bg-primary); border: 1px solid var(--border);
                      border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 4px;
                     transition: width 0.15s ease; }
    .progress-fill.indeterminate { width: 100% !important; opacity: 0.6;
                     background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 10px,
                                 #1f6feb 10px, #1f6feb 20px);
                     animation: slide 1s linear infinite; }
    @keyframes slide { from { background-position: 0 0; } to { background-position: 28px 0; } }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.7rem;
                      color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="/" class="logo-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <rect width="24" height="24" rx="5" fill="#f0883e"/>
        <polyline points="4,16 8,10 12,14 16,7 20,12" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="16" cy="7" r="2" fill="#0d1117"/>
      </svg>
    </a>
    <h1>Database Explorer</h1>
    <span class="subtitle">ALPHA-9</span>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <h3>Tables</h3>
      <button class="btn btn-upload" id="btn-open-upload">⬆ Upload New Table</button>
      <div id="table-list"><span style="color:var(--text-muted);font-size:.8rem;">Loading…</span></div>
      <div class="sidebar-resize" id="sidebar-resize"></div>
    </div>

    <div class="main-panel">
      <div class="tabs">
        <div class="tab active" data-tab="schema">Schema</div>
        <div class="tab" data-tab="data">Data</div>
        <div class="tab" data-tab="sql">SQL Query</div>
        <button class="btn" id="btn-visualize" style="display:none; margin: 4px 8px 4px auto; padding: 4px 12px;"
                title="Open this table in the timeseries visualizer">📈 Visualize</button>
      </div>

      <div class="tab-content active" id="tab-schema">
        <div class="empty-state" id="schema-empty">Select a table from the sidebar</div>
        <table class="schema-table" id="schema-table" style="display:none;"></table>
      </div>

      <div class="tab-content" id="tab-data">
        <div class="empty-state" id="data-empty">Select a table from the sidebar</div>
        <div class="data-wrap" id="data-wrap" style="display:none;">
          <table class="data-table" id="data-table"></table>
        </div>
      </div>

      <div class="tab-content" id="tab-sql">
        <div class="sql-editor">
          <textarea class="sql-input" id="sql-input" placeholder="SELECT * FROM your_table LIMIT 100;"></textarea>
          <div class="sql-actions">
            <button class="btn btn-run" id="btn-run-sql">▶ Run Query</button>
            <span class="sql-status" id="sql-status"></span>
          </div>
          <div id="sql-error"></div>
          <div class="sql-results">
            <div class="data-wrap">
              <table class="data-table" id="sql-results-table"></table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload modal -->
  <div class="modal-overlay" id="upload-modal">
    <div class="modal">
      <h2>Upload New Table</h2>
      <div class="drop-zone" id="drop-zone">Click or drop a file here<br>
        <span style="font-size:0.7rem;">CSV, TSV, Excel, Parquet or JSON</span></div>
      <input type="file" id="file-input" accept=".csv,.tsv,.txt,.xlsx,.xls,.parquet,.parq,.json" style="display:none;">
      <label for="table-name">Table name</label>
      <input type="text" id="table-name" placeholder="my_table">
      <label for="upload-mode">If table exists</label>
      <select id="upload-mode">
        <option value="fail">Fail (don't overwrite)</option>
        <option value="replace">Replace (drop &amp; recreate)</option>
        <option value="append">Append rows</option>
      </select>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label">
          <span id="progress-stage"></span>
          <span id="progress-detail"></span>
        </div>
      </div>
      <div class="upload-status" id="upload-status"></div>
      <div class="modal-actions">
        <button class="btn" id="btn-cancel-upload">Cancel</button>
        <button class="btn btn-run" id="btn-do-upload">Upload &amp; Create</button>
      </div>
    </div>
  </div>

<script>
var currentTable = null;

// Tabs
document.querySelectorAll(".tab").forEach(function(tab) {
  tab.addEventListener("click", function() {
    document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
    document.querySelectorAll(".tab-content").forEach(function(c) { c.classList.remove("active"); });
    tab.classList.add("active");
    document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
  });
});

// Load tables (grouped)
var allTables = [];
var collapsedGroups = JSON.parse(localStorage.getItem("dbx_collapsed") || "{}");

function loadTables() {
  fetch("/api/db/tables")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var list = document.getElementById("table-list");
      if (!data.tables || data.tables.length === 0) {
        list.innerHTML = '<span style="color:var(--text-muted);font-size:.8rem;padding:8px;">No tables found</span>';
        return;
      }
      allTables = data.tables;

      // Bucket tables by group
      var groups = {};
      var ungrouped = [];
      data.tables.forEach(function(t) {
        if (t.group) {
          (groups[t.group] = groups[t.group] || []).push(t);
        } else {
          ungrouped.push(t);
        }
      });

      var html = "";
      function renderItems(tables) {
        var s = "";
        tables.forEach(function(t) {
          s += '<div class="table-item" data-table="' + t.name + '">' +
               '<span class="tbl-name" title="' + t.name + '">' + t.name + '</span>' +
               '<button class="move-btn" title="Move to group" data-table="' + t.name + '">⇄</button>' +
               '<button class="del-btn" title="Delete table" data-table="' + t.name + '">🗑</button>' +
               '<span class="row-count">' + (t.row_count || 0).toLocaleString() + '</span></div>';
        });
        return s;
      }

      Object.keys(groups).sort().forEach(function(g) {
        var collapsed = collapsedGroups[g] ? " collapsed" : "";
        var bodyHidden = collapsedGroups[g] ? " hidden" : "";
        html += '<div class="group-header' + collapsed + '" data-group="' + g + '">' +
                '<span class="arrow">▼</span><span>' + g + '</span>' +
                '<span class="g-count">' + groups[g].length + '</span></div>' +
                '<div class="group-body' + bodyHidden + '" data-group-body="' + g + '">' +
                renderItems(groups[g]) + '</div>';
      });

      if (ungrouped.length) {
        var g = "__ungrouped__";
        var collapsed = collapsedGroups[g] ? " collapsed" : "";
        var bodyHidden = collapsedGroups[g] ? " hidden" : "";
        var label = Object.keys(groups).length ? "Ungrouped" : "All tables";
        html += '<div class="group-header' + collapsed + '" data-group="' + g + '">' +
                '<span class="arrow">▼</span><span>' + label + '</span>' +
                '<span class="g-count">' + ungrouped.length + '</span></div>' +
                '<div class="group-body' + bodyHidden + '" data-group-body="' + g + '">' +
                renderItems(ungrouped) + '</div>';
      }

      list.innerHTML = html;

      // Collapse/expand
      list.querySelectorAll(".group-header").forEach(function(h) {
        h.addEventListener("click", function() {
          var g = h.dataset.group;
          var body = list.querySelector('[data-group-body="' + g + '"]');
          var isCollapsed = h.classList.toggle("collapsed");
          body.classList.toggle("hidden", isCollapsed);
          collapsedGroups[g] = isCollapsed;
          localStorage.setItem("dbx_collapsed", JSON.stringify(collapsedGroups));
        });
      });

      // Select table
      list.querySelectorAll(".table-item").forEach(function(item) {
        item.addEventListener("click", function(e) {
          if (e.target.classList.contains("move-btn")) return;
          if (e.target.classList.contains("del-btn")) return;
          list.querySelectorAll(".table-item").forEach(function(i) { i.classList.remove("active"); });
          item.classList.add("active");
          selectTable(item.dataset.table);
        });
      });

      // Move-to-group menu
      list.querySelectorAll(".move-btn").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          openGroupMenu(btn.dataset.table, e.clientX, e.clientY);
        });
      });

      // Delete table
      list.querySelectorAll(".del-btn").forEach(function(btn) {
        btn.addEventListener("click", function(e) {
          e.stopPropagation();
          deleteTable(btn.dataset.table);
        });
      });
    });
}

function deleteTable(table) {
  if (!confirm('Delete table "' + table + '"? This permanently drops it from the database and cannot be undone.')) return;
  fetch("/api/db/table/" + encodeURIComponent(table), { method: "DELETE" })
    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, d: d }; }); })
    .then(function(res) {
      if (!res.ok) { alert("Delete failed: " + (res.d.error || "unknown error")); return; }
      if (currentTable === table) {
        currentTable = null;
        var vbtn = document.getElementById("btn-visualize");
        if (vbtn) vbtn.style.display = "none";
        var st = document.getElementById("schema-table");
        if (st) st.style.display = "none";
        var se = document.getElementById("schema-empty");
        if (se) se.style.display = "flex";
        var dt = document.getElementById("data-table");
        if (dt) dt.style.display = "none";
        var de = document.getElementById("data-empty");
        if (de) de.style.display = "flex";
      }
      loadTables();
    })
    .catch(function(err) { alert("Delete failed: " + err); });
}

function existingGroupNames() {
  var names = {};
  allTables.forEach(function(t) { if (t.group) names[t.group] = true; });
  return Object.keys(names).sort();
}

function closeGroupMenu() {
  var m = document.getElementById("group-menu");
  if (m) m.remove();
}

function openGroupMenu(table, x, y) {
  closeGroupMenu();
  var menu = document.createElement("div");
  menu.className = "group-menu";
  menu.id = "group-menu";
  var current = null;
  allTables.forEach(function(t) { if (t.name === table) current = t.group; });

  var html = '<div class="gm-item" data-action="new">＋ New group…</div>';
  var names = existingGroupNames();
  if (names.length) html += '<div class="gm-sep"></div>';
  names.forEach(function(g) {
    html += '<div class="gm-item" data-group="' + g + '">' + (g === current ? "✓ " : "") + g + '</div>';
  });
  if (current) {
    html += '<div class="gm-sep"></div><div class="gm-item" data-action="remove">✕ Remove from group</div>';
  }
  menu.innerHTML = html;
  document.body.appendChild(menu);

  // Keep on screen
  var rect = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, window.innerWidth - rect.width - 8) + "px";
  menu.style.top = Math.min(y, window.innerHeight - rect.height - 8) + "px";

  menu.querySelectorAll(".gm-item").forEach(function(mi) {
    mi.addEventListener("click", function() {
      var group;
      if (mi.dataset.action === "new") {
        group = prompt("New group name:");
        if (!group) { closeGroupMenu(); return; }
      } else if (mi.dataset.action === "remove") {
        group = "";
      } else {
        group = mi.dataset.group;
      }
      assignGroup(table, group);
      closeGroupMenu();
    });
  });

  setTimeout(function() {
    document.addEventListener("click", function handler(e) {
      if (!menu.contains(e.target)) { closeGroupMenu(); document.removeEventListener("click", handler); }
    });
  }, 0);
}

function assignGroup(table, group) {
  fetch("/api/db/table-group", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ table: table, group: group })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) { alert(data.error); return; }
      loadTables();
    });
}

function selectTable(name) {
  currentTable = name;
  var vbtn = document.getElementById("btn-visualize");
  vbtn.style.display = "inline-block";
  vbtn.onclick = function() { window.location = "/?dbtable=" + encodeURIComponent(name); };
  loadSchema(name);
  loadData(name);
}

function loadSchema(name) {
  document.getElementById("schema-empty").style.display = "none";
  var table = document.getElementById("schema-table");
  table.style.display = "table";
  table.innerHTML = '<tr><th>Column</th><th>Type</th><th>Nullable</th><th>Default</th></tr>';

  fetch("/api/db/schema/" + encodeURIComponent(name))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var html = '<tr><th>Column</th><th>Type</th><th>Nullable</th><th>Default</th></tr>';
      data.columns.forEach(function(col) {
        html += '<tr><td>' + col.name + '</td><td class="type">' + col.type + '</td>' +
                '<td>' + (col.nullable ? 'YES' : 'NO') + '</td>' +
                '<td>' + (col.default || '—') + '</td></tr>';
      });
      table.innerHTML = html;
    });
}

function loadData(name) {
  document.getElementById("data-empty").style.display = "none";
  var wrap = document.getElementById("data-wrap");
  wrap.style.display = "block";
  var table = document.getElementById("data-table");
  table.innerHTML = '<tr><td>Loading…</td></tr>';

  fetch("/api/db/preview/" + encodeURIComponent(name) + "?limit=100")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) { table.innerHTML = '<tr><td>' + data.error + '</td></tr>'; return; }
      var html = '<thead><tr>';
      data.columns.forEach(function(col) { html += '<th>' + col + '</th>'; });
      html += '</tr></thead><tbody>';
      data.rows.forEach(function(row) {
        html += '<tr>';
        row.forEach(function(val) { html += '<td>' + (val !== null ? val : '<span style="color:var(--text-muted)">NULL</span>') + '</td>'; });
        html += '</tr>';
      });
      html += '</tbody>';
      table.innerHTML = html;
    });
}

// SQL Query
document.getElementById("btn-run-sql").addEventListener("click", runQuery);
document.getElementById("sql-input").addEventListener("keydown", function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { runQuery(); }
});

function runQuery() {
  var sql = document.getElementById("sql-input").value.trim();
  if (!sql) return;
  var status = document.getElementById("sql-status");
  var errDiv = document.getElementById("sql-error");
  var table = document.getElementById("sql-results-table");
  status.textContent = "Running…";
  errDiv.innerHTML = "";
  table.innerHTML = "";

  var start = Date.now();
  fetch("/api/db/query", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql: sql })
  })
    .then(function(r) {
      return r.text().then(function(t) {
        try { return JSON.parse(t); }
        catch (e) { throw new Error("Server error (HTTP " + r.status + "). The query may have timed out."); }
      });
    })
    .then(function(data) {
      var elapsed = ((Date.now() - start) / 1000).toFixed(2);
      if (data.error) {
        status.textContent = "";
        errDiv.innerHTML = '<div class="sql-error">' + data.error + '</div>';
        return;
      }
      status.textContent = data.row_count + " rows · " + elapsed + "s";
      if (!data.columns || data.columns.length === 0) { return; }
      var html = '<thead><tr>';
      data.columns.forEach(function(col) { html += '<th>' + col + '</th>'; });
      html += '</tr></thead><tbody>';
      data.rows.forEach(function(row) {
        html += '<tr>';
        row.forEach(function(val) { html += '<td>' + (val !== null ? val : '<span style="color:var(--text-muted)">NULL</span>') + '</td>'; });
        html += '</tr>';
      });
      html += '</tbody>';
      table.innerHTML = html;
    })
    .catch(function(err) {
      status.textContent = "";
      errDiv.innerHTML = '<div class="sql-error">' + err + '</div>';
    });
}

// Upload new table
var uploadFile = null;
var modal = document.getElementById("upload-modal");
var dropZone = document.getElementById("drop-zone");
var fileInput = document.getElementById("file-input");

document.getElementById("btn-open-upload").addEventListener("click", function() {
  modal.classList.add("open");
});
document.getElementById("btn-cancel-upload").addEventListener("click", function() {
  modal.classList.remove("open");
  resetUploadForm();
});
modal.addEventListener("click", function(e) {
  if (e.target === modal) { modal.classList.remove("open"); resetUploadForm(); }
});

function resetUploadForm() {
  uploadFile = null;
  fileInput.value = "";
  dropZone.classList.remove("has-file");
  dropZone.innerHTML = 'Click or drop a file here<br><span style="font-size:0.7rem;">CSV, TSV, Excel, Parquet or JSON</span>';
  document.getElementById("table-name").value = "";
  document.getElementById("upload-status").textContent = "";
  document.getElementById("upload-status").className = "upload-status";
  hideProgress();
  document.getElementById("btn-do-upload").disabled = false;
}

function setUploadFile(f) {
  uploadFile = f;
  dropZone.classList.add("has-file");
  dropZone.textContent = f.name + " (" + (f.size / 1048576).toFixed(1) + " MB)";
  var nameField = document.getElementById("table-name");
  if (!nameField.value) {
    nameField.value = f.name.replace(/\.[^.]+$/, "").replace(/[^a-zA-Z0-9]+/g, "_").toLowerCase();
  }
}

dropZone.addEventListener("click", function() { fileInput.click(); });
fileInput.addEventListener("change", function() {
  if (fileInput.files.length) setUploadFile(fileInput.files[0]);
});
dropZone.addEventListener("dragover", function(e) { e.preventDefault(); dropZone.classList.add("drag"); });
dropZone.addEventListener("dragleave", function() { dropZone.classList.remove("drag"); });
dropZone.addEventListener("drop", function(e) {
  e.preventDefault();
  dropZone.classList.remove("drag");
  if (e.dataTransfer.files.length) setUploadFile(e.dataTransfer.files[0]);
});

function setProgress(pct, stage, detail) {
  var wrap = document.getElementById("progress-wrap");
  var fill = document.getElementById("progress-fill");
  wrap.classList.add("visible");
  if (pct === null) {
    fill.classList.add("indeterminate");
  } else {
    fill.classList.remove("indeterminate");
    fill.style.width = pct + "%";
  }
  document.getElementById("progress-stage").textContent = stage || "";
  document.getElementById("progress-detail").textContent = detail || "";
}

function hideProgress() {
  var wrap = document.getElementById("progress-wrap");
  var fill = document.getElementById("progress-fill");
  wrap.classList.remove("visible");
  fill.classList.remove("indeterminate");
  fill.style.width = "0%";
}

document.getElementById("btn-do-upload").addEventListener("click", function() {
  var status = document.getElementById("upload-status");
  if (!uploadFile) { status.textContent = "Choose a file first."; status.className = "upload-status err"; return; }
  var fd = new FormData();
  fd.append("file", uploadFile);
  fd.append("table_name", document.getElementById("table-name").value);
  fd.append("mode", document.getElementById("upload-mode").value);
  status.textContent = "";
  status.className = "upload-status";
  var btn = document.getElementById("btn-do-upload");
  btn.disabled = true;

  var xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/db/upload");
  xhr.timeout = 300000;

  xhr.upload.addEventListener("progress", function(e) {
    if (e.lengthComputable) {
      var pct = Math.round((e.loaded / e.total) * 100);
      var mb = function(b) { return (b / 1048576).toFixed(1); };
      if (pct >= 100) {
        setProgress(null, "Extracting & loading into database…", mb(e.total) + " MB sent");
      } else {
        setProgress(pct, "Uploading… " + pct + "%", mb(e.loaded) + " / " + mb(e.total) + " MB");
      }
    }
  });

  xhr.addEventListener("load", function() {
    btn.disabled = false;
    var data;
    try { data = JSON.parse(xhr.responseText); }
    catch (e) {
      hideProgress();
      status.textContent = "Server error (HTTP " + xhr.status + "). The file may be too large or the request timed out.";
      status.className = "upload-status err";
      return;
    }
    if (data.error) {
      hideProgress();
      status.textContent = data.error;
      status.className = "upload-status err";
      return;
    }
    setProgress(100, "Done", "");
    status.textContent = "✓ Table \"" + data.table + "\" " + data.mode + " — " +
      data.rows.toLocaleString() + " rows, " + data.columns + " columns.";
    status.className = "upload-status ok";
    loadTables();
    setTimeout(function() {
      modal.classList.remove("open");
      resetUploadForm();
      selectTable(data.table);
      var item = document.querySelector('.table-item[data-table="' + data.table + '"]');
      if (item) item.classList.add("active");
    }, 1200);
  });

  xhr.addEventListener("error", function() {
    btn.disabled = false;
    hideProgress();
    status.textContent = "Network error during upload.";
    status.className = "upload-status err";
  });

  xhr.addEventListener("timeout", function() {
    btn.disabled = false;
    hideProgress();
    status.textContent = "Upload timed out after 5 minutes.";
    status.className = "upload-status err";
  });

  xhr.send(fd);
});

// Sidebar drag-to-resize (matches the visualiser columns sidebar)
(function() {
  var handle = document.getElementById("sidebar-resize");
  var sidebar = document.getElementById("sidebar");
  var saved = parseInt(localStorage.getItem("dbx_sidebar_width"), 10);
  if (saved && saved >= 120 && saved <= 600) sidebar.style.width = saved + "px";
  var startX, startWidth;
  handle.addEventListener("mousedown", function(e) {
    e.preventDefault();
    startX = e.clientX;
    startWidth = sidebar.offsetWidth;
    handle.classList.add("active");
    document.body.style.userSelect = "none";
    document.addEventListener("mousemove", onDrag);
    document.addEventListener("mouseup", onUp);
  });
  function onDrag(e) {
    var newWidth = startWidth + (e.clientX - startX);
    if (newWidth < 120) newWidth = 120;
    if (newWidth > 600) newWidth = 600;
    sidebar.style.width = newWidth + "px";
  }
  function onUp() {
    handle.classList.remove("active");
    document.body.style.userSelect = "";
    localStorage.setItem("dbx_sidebar_width", sidebar.offsetWidth);
    document.removeEventListener("mousemove", onDrag);
    document.removeEventListener("mouseup", onUp);
  }
})();

// Init
loadTables();
</script>
