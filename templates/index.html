<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Analyser</title>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #1c2128;
      --bg-card: #1c2128;
      --border: #30363d;
      --border-highlight: #58a6ff;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --green-bg: #0d2818;
      --green-border: #238636;
      --red: #f85149;
      --orange: #d29922;
      --purple: #a371f7;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
           background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; }
    .container { max-width: 100%; margin: 0 auto; padding: 16px; overflow-x: hidden; }
    .hidden { display: none !important; }

    /* Header */
    .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
                  padding: 6px 0; border-bottom: 1px solid var(--border); height: 32px; }
    .app-header .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; text-transform: uppercase;
                            letter-spacing: 1px; }

    /* Wizard */
    .wizard { max-width: 1000px; margin: 0 auto; }
    .wizard-step { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
                   padding: 24px; margin-bottom: 16px; }
    .wizard-step h2 { font-size: 1rem; margin-bottom: 14px; color: var(--text-primary); font-weight: 600; }
    .wizard-step .step-num { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center;
                             background: var(--accent); color: var(--bg-primary); border-radius: 50%;
                             font-size: 0.75rem; font-weight: 700; margin-right: 8px; }
    .wizard-step.disabled { opacity: 0.35; pointer-events: none; }

    /* Upload area */
    .upload-area { border: 1px dashed var(--border); border-radius: 6px; padding: 40px; text-align: center;
                   cursor: pointer; transition: border-color 0.15s; background: var(--bg-secondary); }
    .upload-area:hover { border-color: var(--accent); }
    .upload-area input[type=file] { display: none; }
    .upload-area label { cursor: pointer; font-size: 0.95rem; color: var(--text-secondary); }
    .upload-area label strong { color: var(--accent); }
    .upload-success { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                      background: var(--green-bg); border: 1px solid var(--green-border);
                      border-radius: 6px; font-size: 0.85rem; color: var(--green); }
    .upload-success .file-info { font-weight: 600; color: var(--text-primary); }

    /* Selection panels */
    .select-panels { display: flex; gap: 16px; flex-wrap: wrap; }
    .select-panel { flex: 1; min-width: 280px; }
    .select-panel h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);
                       text-transform: uppercase; letter-spacing: 0.5px; }
    .select-panel .panel-actions { display: flex; gap: 6px; margin-bottom: 6px; }
    .select-panel .panel-actions button { font-size: 0.7rem; padding: 3px 10px; border: 1px solid var(--border);
                                          border-radius: 4px; background: var(--bg-secondary); color: var(--text-secondary);
                                          cursor: pointer; transition: all 0.15s; }
    .select-panel .panel-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .select-list { max-height: 350px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px;
                   padding: 4px; background: var(--bg-secondary); }
    .select-list label { display: block; padding: 4px 8px; font-size: 0.8rem; cursor: pointer; border-radius: 3px;
                         color: var(--text-secondary); transition: background 0.1s; }
    .select-list label:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .select-list input[type=checkbox] { margin-right: 8px; accent-color: var(--accent); }
    /* Date tree hierarchy */
    .date-tree details { margin: 0; }
    .date-tree summary { display: flex; align-items: center; padding: 4px 8px; font-size: 0.8rem;
                         cursor: pointer; border-radius: 3px; color: var(--text-secondary); font-weight: 600; }
    .date-tree summary:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .date-tree summary input[type=checkbox] { margin-right: 8px; accent-color: var(--accent); }
    .date-tree .month-items { padding-left: 22px; }

    /* Config row */
    .config-row { margin-top: 16px; }
    .config-row label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px;
                        color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .config-row input[type=text] { width: 100%; max-width: 500px; padding: 8px 12px; border: 1px solid var(--border);
                                   border-radius: 4px; font-size: 0.85rem; background: var(--bg-secondary);
                                   color: var(--text-primary); transition: border-color 0.15s; }
    .config-row input[type=text]:focus { outline: none; border-color: var(--accent); }

    /* Preview table */
    .preview-wrap { overflow-x: auto; margin-top: 16px; }
    .preview-wrap h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary);
                       text-transform: uppercase; letter-spacing: 0.5px; }
    .preview-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    .preview-table th, .preview-table td { padding: 6px 10px; border: 1px solid var(--border);
                                           text-align: left; white-space: nowrap; }
    .preview-table th { background: var(--bg-tertiary); font-weight: 600; color: var(--text-secondary);
                        position: sticky; top: 0; }
    .preview-table td { color: var(--text-primary); }
    .preview-table tr:nth-child(even) td { background: rgba(56,139,253,0.02); }

    /* Buttons */
    .wizard-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .btn { padding: 8px 18px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-secondary);
           cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); transition: all 0.15s; }
    .btn:hover { border-color: var(--text-muted); color: var(--text-primary); }
    .btn-go { background: var(--accent); color: var(--bg-primary); border: 1px solid var(--accent);
              font-weight: 600; font-size: 0.82rem; padding: 6px 14px; border-radius: 4px; cursor: pointer; }
    .btn-go:hover { background: #58a6ff; border-color: #58a6ff; }

    /* Memory / Recent sessions */
    .recent-sessions { margin-bottom: 16px; }
    .recent-sessions h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary);
                          text-transform: uppercase; letter-spacing: 0.5px; }
    .recent-list { display: flex; flex-direction: column; gap: 6px; }
    .recent-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
                   background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px;
                   cursor: pointer; transition: border-color 0.15s; }
    .recent-item:hover { border-color: var(--accent); }
    .recent-item .ri-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
    .recent-item .ri-meta { font-size: 0.72rem; color: var(--text-muted); }
    .recent-item .ri-delete { margin-left: auto; font-size: 0.7rem; color: var(--text-muted);
                              cursor: pointer; padding: 2px 6px; border-radius: 3px; }
    .recent-item .ri-delete:hover { background: rgba(248,81,73,0.15); color: #f85149; }

    /* Homepage */
    .homepage-files { margin-bottom: 20px; }
    .homepage-files h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; color: var(--text-secondary);
                         text-transform: uppercase; letter-spacing: 0.5px; }
    .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .file-card { padding: 14px 16px; background: var(--bg-secondary); border: 1px solid var(--border);
                 border-radius: 8px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
    .file-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .file-card .fc-name { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); margin-bottom: 4px;
                          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-card .fc-meta { font-size: 0.72rem; color: var(--text-muted); line-height: 1.5; }
    .file-card .fc-actions { display: flex; gap: 6px; margin-top: 8px; }
    .file-card .fc-actions button { font-size: 0.7rem; padding: 3px 8px; border: 1px solid var(--border);
                                    border-radius: 3px; background: var(--bg-tertiary); color: var(--text-muted);
                                    cursor: pointer; }
    .file-card .fc-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .file-card .fc-actions .fc-del:hover { border-color: #f85149; color: #f85149; }

    /* Toolbar */
    .toolbar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; align-items: center;
               padding: 10px 14px; background: var(--bg-secondary); border: 1px solid var(--border);
               border-radius: 6px; }
    .toolbar button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 4px;
                      background: var(--bg-tertiary); cursor: pointer; font-size: 0.82rem;
                      color: var(--text-secondary); transition: all 0.15s; }
    .toolbar button:hover { border-color: var(--accent); color: var(--accent); }
    .toolbar button.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent);
                             font-weight: 600; }

    /* Main layout */
    .main { display: flex; gap: 10px; align-items: stretch; overflow: hidden; }
    .sidebar { width: 300px; min-width: 0; max-height: 85vh; overflow-y: auto;
               background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px;
               padding: 10px; flex-shrink: 0; transition: width 0.2s, padding 0.2s;
               position: relative; }
    .sidebar.collapsed { width: 28px; padding: 10px 2px; overflow: hidden; }
    .sidebar.collapsed .col-group, .sidebar.collapsed .group-btns { display: none; }
    .toggle-sidebar { position: sticky; top: 0; display: block; background: var(--bg-tertiary);
                      border: 1px solid var(--border); border-radius: 4px; width: 22px; height: 22px;
                      display: flex; align-items: center; justify-content: center; margin-left: auto;
                      cursor: pointer; font-size: 0.65rem; color: var(--text-muted); transition: all 0.15s;
                      z-index: 2; padding: 0; margin-bottom: 6px; }
    .toggle-sidebar:hover { color: var(--accent); border-color: var(--accent); }
    .sidebar details { margin-bottom: 4px; }
    .sidebar summary { cursor: pointer; font-weight: 600; padding: 6px 4px; font-size: 0.82rem;
                       color: var(--text-secondary); border-radius: 3px; }
    .sidebar summary:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .sidebar .group-btns { display: flex; gap: 4px; margin: 4px 0 4px 8px; }
    .sidebar .group-btns button { font-size: 0.7rem; padding: 2px 8px; border: 1px solid var(--border);
                                   border-radius: 3px; background: var(--bg-tertiary); color: var(--text-muted);
                                   cursor: pointer; }
    .sidebar .group-btns button:hover { color: var(--accent); border-color: var(--accent); }
    .sidebar label { display: block; padding: 3px 4px 3px 12px; font-size: 0.8rem; cursor: pointer;
                     color: var(--text-secondary); border-radius: 3px; }
    .sidebar label:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .sidebar input[type=checkbox] { margin-right: 6px; accent-color: var(--accent); }
    #chart { flex: 1; min-width: 0; min-height: 500px; overflow: auto; max-width: 100%; background: var(--bg-secondary);
             border: 1px solid var(--border); border-radius: 6px; padding: 8px; max-height: 85vh; }
    .placeholder { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 0.95rem; }

    /* Loading indicator */
    .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(13,17,23,0.9);
                       z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    .loading-overlay.visible { display: flex; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent);
               border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay p { margin-top: 14px; font-size: 0.9rem; color: var(--text-secondary); }
    .progress-bar { width: 220px; height: 6px; background: var(--border); border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .progress-bar .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.15s; width: 0%; }
    .progress-pct { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
<div class="container">
  <div class="app-header">
    <span class="subtitle">Timeseries Intelligence</span>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Uploading and processing file…</p>
    <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-pct" id="progress-pct"></span>
  </div>

  <!-- ═══ HOMEPAGE ═══ -->
  <div id="homepage">
    <div class="homepage-files" id="homepage-files"></div>
    <div class="wizard-step" id="step-upload">
      <h2><span class="step-num">📄</span> Upload new file</h2>
      <div class="upload-area" id="upload-area">
        <label for="csv-file">
          <strong>Click to upload</strong> or drag &amp; drop a data file<br>
          <small style="color:var(--text-muted)">Supports CSV, Parquet, and Excel (.xlsx/.xls)</small>
        </label>
        <input type="file" id="csv-file" accept=".csv,.parquet,.parq,.xlsx,.xls">
      </div>
    </div>
  </div>

  <!-- ═══ WIZARD (column/month selection) ═══ -->
  <div class="wizard hidden" id="wizard">
    <div class="wizard-step" id="step-select">
      <h2><span class="step-num">⚙</span> Select columns &amp; date range</h2>

      <div class="select-panels">
        <div class="select-panel">
          <h3>Columns</h3>
          <div class="panel-actions">
            <button id="cols-select-all">Select all</button>
            <button id="cols-clear">Clear</button>
          </div>
          <div class="select-list" id="col-list"></div>
        </div>
        <div class="select-panel">
          <h3>Date periods (months)</h3>
          <div class="panel-actions">
            <button id="months-select-all">Select all</button>
            <button id="months-clear">Clear</button>
          </div>
          <div class="select-list" id="month-list"></div>
        </div>
      </div>

      <div class="preview-wrap">
        <h3>Preview (first 10 rows)</h3>
        <table class="preview-table" id="preview-table"></table>
      </div>

      <div class="wizard-actions">
        <button class="btn" id="btn-back-home">← Back</button>
        <button class="btn-go" id="btn-ingest">Load selected data →</button>
      </div>
    </div>
  </div>

  <!-- ═══ VISUALISER ═══ -->
  <div class="toolbar hidden" id="toolbar">
    <button id="btn-weekly">Weekly</button>
    <button id="btn-monthly">Monthly</button>
    <button id="btn-yearly" class="active">Yearly</button>
    <button id="btn-normalise">Show normalised</button>
    <label style="font-size:.75rem;color:var(--text-muted);margin-left:10px;display:flex;align-items:center;gap:4px;">
      Y+ <input type="number" id="y-axis-cap" style="width:60px;padding:3px 6px;font-size:.75rem;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);" placeholder="None">
    </label>
    <label style="font-size:.75rem;color:var(--text-muted);margin-left:4px;display:flex;align-items:center;gap:4px;">
      Y− <input type="number" id="y-axis-cap-neg" style="width:60px;padding:3px 6px;font-size:.75rem;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);" placeholder="None">
    </label>
    <span id="row-count" style="margin-left:12px;font-size:.8rem;color:var(--text-muted);font-weight:600"></span>
    <button id="btn-edit-selection" style="margin-left:auto;font-size:.75rem;padding:4px 10px;">⚙ Edit selection</button>
    <button id="btn-home" style="margin-left:8px;font-size:.75rem;padding:4px 10px;">🏠 Home</button>
  </div>

  <div class="main hidden" id="main-area">
    <div class="sidebar" id="sidebar">
      <button class="toggle-sidebar" id="btn-toggle-sidebar" title="Toggle sidebar">◀</button>
    </div>
    <div id="chart">
      <div class="placeholder">Select columns from the sidebar and click <strong>⚡ Apply selection</strong></div>
    </div>
  </div>
</div>

<script>
const DARK_PLOTLY_LAYOUT = {
  paper_bgcolor: '#1c2128',
  plot_bgcolor: '#161b22',
  font: { color: '#8b949e', size: 11 },
  xaxis: { gridcolor: '#30363d', zerolinecolor: '#30363d' },
  yaxis: { gridcolor: '#30363d', zerolinecolor: '#30363d' },
};

const state = { period: "Yearly", normalised: false, groups: null, scanData: null, currentFile: null };

// ── IndexedDB for file blob caching ─────────────────────────────────
const DB_NAME = "signal_analyser_files";
const DB_VERSION = 1;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => req.result.createObjectStore("files", { keyPath: "name" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function storeFile(name, blob) {
  const db = await openDB();
  const tx = db.transaction("files", "readwrite");
  tx.objectStore("files").put({ name, blob, storedAt: Date.now() });
  return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = rej; });
}
async function getFile(name) {
  const db = await openDB();
  const tx = db.transaction("files", "readonly");
  const req = tx.objectStore("files").get(name);
  return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = rej; });
}
async function deleteFile(name) {
  const db = await openDB();
  const tx = db.transaction("files", "readwrite");
  tx.objectStore("files").delete(name);
}

// ── Memory (localStorage) ───────────────────────────────────────────
const MEMORY_KEY = "signal_analyser_sessions";
function getMemory() {
  try { return JSON.parse(localStorage.getItem(MEMORY_KEY) || "[]"); }
  catch { return []; }
}
function saveMemory(entries) {
  localStorage.setItem(MEMORY_KEY, JSON.stringify(entries.slice(0, 20)));
}
function saveSession(filename, config) {
  const entries = getMemory();
  const filtered = entries.filter(e => e.filename !== filename);
  filtered.unshift({
    filename,
    sid: config.sid || null,
    columns: config.columns,
    months: config.months,
    eventCols: config.eventCols || "",
    savedAt: new Date().toISOString(),
  });
  saveMemory(filtered);
}
function timeAgo(isoStr) {
  const diff = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  const days = Math.floor(hrs / 24);
  return days + "d ago";
}

// ── Navigation helpers ──────────────────────────────────────────────
function showView(view) {
  document.getElementById("homepage").classList.toggle("hidden", view !== "home");
  document.getElementById("wizard").classList.toggle("hidden", view !== "wizard");
  document.getElementById("toolbar").classList.toggle("hidden", view !== "visualiser");
  document.getElementById("main-area").classList.toggle("hidden", view !== "visualiser");
}

function showLoading(msg) {
  document.getElementById("loading-text").textContent = msg;
  document.getElementById("progress-fill").style.width = "0%";
  document.getElementById("progress-pct").textContent = "";
  document.getElementById("loading").classList.add("visible");
}
function hideLoading() { document.getElementById("loading").classList.remove("visible"); }
function setProgress(pct) {
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-pct").textContent = Math.round(pct) + "%";
}

function uploadWithProgress(fd) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = (e.loaded / e.total) * 70; // Upload is 0-70%
        setProgress(pct);
      }
    };
    xhr.onload = () => {
      setProgress(90); // Processing on server
      try { resolve(JSON.parse(xhr.responseText)); }
      catch { reject(new Error("Invalid response")); }
    };
    xhr.onerror = () => reject(new Error("Upload failed"));
    xhr.send(fd);
  });
}

// ── Homepage ────────────────────────────────────────────────────────
function renderHomepage() {
  const entries = getMemory();
  const container = document.getElementById("homepage-files");
  if (entries.length === 0) { container.innerHTML = ""; return; }
  let html = '<h3>📁 Your files</h3><div class="file-grid">';
  entries.forEach((entry, idx) => {
    const colCount = entry.columns ? entry.columns.length : 0;
    const monthCount = entry.months ? entry.months.length : 0;
    html += `
      <div class="file-card" data-idx="${idx}">
        <div class="fc-name">${entry.filename}</div>
        <div class="fc-meta">
          ${colCount} columns · ${monthCount} months<br>
          Last used ${timeAgo(entry.savedAt)}
        </div>
        <div class="fc-actions">
          <button class="fc-del" data-idx="${idx}">Delete</button>
        </div>
      </div>`;
  });
  html += '</div>';
  container.innerHTML = html;

  // Event listeners
  container.querySelectorAll(".file-card").forEach(card => {
    card.addEventListener("click", (e) => {
      if (e.target.classList.contains("fc-del")) return;
      openSavedFile(entries[parseInt(card.dataset.idx)]);
    });
  });
  container.querySelectorAll(".fc-del").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.idx);
      const entry = entries[idx];
      deleteFile(entry.filename);
      const mem = getMemory();
      mem.splice(idx, 1);
      saveMemory(mem);
      renderHomepage();
    });
  });
}

async function openSavedFile(entry) {
  state.currentFile = entry.filename;
  showLoading("Loading " + entry.filename + "…");

  try {
    // Fast path: check if server still has the data cached
    if (entry.sid) {
      const checkR = await fetch("/api/check-cache", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sid: entry.sid }),
      });
      const checkData = await checkR.json();
      if (checkData.cached) {
        setProgress(50);
        state.scanData = checkData;
        // Skip upload, go straight to ingest
        document.getElementById("loading-text").textContent = "Applying selections…";
        const r = await fetch("/api/ingest", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sid: entry.sid,
            columns: entry.columns || [],
            months: entry.months || [],
            event_cols: "",
          }),
        });
        const ingestData = await r.json();
        setProgress(100);
        hideLoading();
        if (ingestData.error) { alert(ingestData.error); return; }
        state.groups = ingestData.groups;
        document.getElementById("row-count").textContent = `${ingestData.row_count.toLocaleString()} rows`;
        buildSidebar(ingestData.groups);
        showView("visualiser");
        return;
      }
    }

    // Slow path: re-upload from IndexedDB
    const cached = await getFile(entry.filename);
    if (!cached) {
      hideLoading();
      alert(`File "${entry.filename}" is no longer cached.\nPlease re-upload it.`);
      state.pendingRestore = entry;
      return;
    }
    const fd = new FormData();
    fd.append("file", cached.blob, entry.filename);
    const data = await uploadWithProgress(fd);
    if (data.error) { hideLoading(); alert(data.error); return; }
    state.scanData = data;
    // Update stored sid for next time
    entry.sid = data.sid;
    saveSession(entry.filename, entry);
    setProgress(80);

    document.getElementById("loading-text").textContent = "Applying selections…";
    const r = await fetch("/api/ingest", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sid: data.sid,
        columns: entry.columns || [],
        months: entry.months || [],
        event_cols: "",
      }),
    });
    const ingestData = await r.json();
    setProgress(100);
    hideLoading();
    if (ingestData.error) { alert(ingestData.error); return; }

    state.groups = ingestData.groups;
    document.getElementById("row-count").textContent = `${ingestData.row_count.toLocaleString()} rows`;
    buildSidebar(ingestData.groups);
    showView("visualiser");
  } catch (err) {
    hideLoading();
    alert("Failed to load file: " + err);
  }
}
  }
}

function showWizardWithRestore(data, entry) {
  showView("wizard");
  buildColumnList(data.columns);
  buildMonthList(data.months);

  // Restore saved selections
  if (entry) {
    const colSet = new Set(entry.columns || []);
    document.querySelectorAll("#col-list input[type=checkbox]").forEach(cb => {
      cb.checked = colSet.has(cb.value);
    });
    const monthSet = new Set(entry.months || []);
    document.querySelectorAll("#month-list .month-items input[type=checkbox]").forEach(cb => {
      cb.checked = monthSet.has(cb.value);
    });
    // Update year checkbox states
    document.querySelectorAll("#month-list details").forEach(det => {
      const yearCb = det.querySelector("summary input");
      const monthCbs = det.querySelectorAll(".month-items input");
      const checked = [...monthCbs].filter(c => c.checked).length;
      yearCb.checked = checked === monthCbs.length;
      yearCb.indeterminate = checked > 0 && checked < monthCbs.length;
    });
  }
  updatePreview();
}

// ── Upload (new file) ───────────────────────────────────────────────
const uploadArea = document.getElementById("upload-area");
const csvInput = document.getElementById("csv-file");

uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.style.borderColor = "var(--accent)"; });
uploadArea.addEventListener("dragleave", () => { uploadArea.style.borderColor = ""; });
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.style.borderColor = "";
  if (e.dataTransfer.files.length) { csvInput.files = e.dataTransfer.files; handleUpload(); }
});
uploadArea.addEventListener("click", () => csvInput.click());
csvInput.addEventListener("change", handleUpload);

async function handleUpload() {
  const file = csvInput.files[0];
  if (!file) return;
  state.currentFile = file.name;
  showLoading("Uploading " + file.name + "…");

  // Cache file blob in IndexedDB
  await storeFile(file.name, file);

  const fd = new FormData();
  fd.append("file", file);

  try {
    const data = await uploadWithProgress(fd);
    setProgress(100);
    hideLoading();
    if (data.error) { alert(data.error); return; }
    state.scanData = data;

    const restore = state.pendingRestore;
    state.pendingRestore = null;
    showWizardWithRestore(data, restore);
  } catch (err) {
    hideLoading();
    alert("Upload failed: " + err);
  }
}

// ── Wizard: Column & Month selection ────────────────────────────────
function buildColumnList(columns) {
  const list = document.getElementById("col-list");
  const frag = document.createDocumentFragment();
  columns.forEach(col => {
    const lbl = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.value = col; cb.checked = false;
    cb.addEventListener("change", updatePreview);
    lbl.append(cb, " " + col);
    frag.appendChild(lbl);
  });
  list.innerHTML = "";
  list.appendChild(frag);
}

function buildMonthList(months) {
  const list = document.getElementById("month-list");
  list.innerHTML = "";
  list.classList.add("date-tree");

  // Group months by year
  const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const yearMap = {};
  months.forEach(m => {
    const [year, mo] = m.split("-");
    if (!yearMap[year]) yearMap[year] = [];
    yearMap[year].push({ value: m, label: MONTH_NAMES[parseInt(mo) - 1] });
  });

  const frag = document.createDocumentFragment();
  Object.keys(yearMap).sort().reverse().forEach(year => {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    const yearCb = document.createElement("input");
    yearCb.type = "checkbox"; yearCb.dataset.year = year;
    summary.append(yearCb, " " + year);
    details.appendChild(summary);

    const monthDiv = document.createElement("div");
    monthDiv.className = "month-items";

    yearMap[year].forEach(mo => {
      const lbl = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.value = mo.value; cb.checked = false;
      cb.addEventListener("change", () => {
        // Update year checkbox state
        const siblings = monthDiv.querySelectorAll("input[type=checkbox]");
        const checked = [...siblings].filter(c => c.checked).length;
        yearCb.checked = checked === siblings.length;
        yearCb.indeterminate = checked > 0 && checked < siblings.length;
        updatePreview();
      });
      lbl.append(cb, " " + mo.label);
      monthDiv.appendChild(lbl);
    });

    // Year checkbox toggles all months in that year
    yearCb.addEventListener("change", () => {
      monthDiv.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = yearCb.checked);
      yearCb.indeterminate = false;
      updatePreview();
    });

    details.appendChild(monthDiv);
    frag.appendChild(details);
  });
  list.appendChild(frag);
}

function updatePreview() {
  if (!state.scanData) return;
  const preview = state.scanData.preview;
  const dateCol = state.scanData.date_col;
  const selectedCols = new Set([...document.querySelectorAll("#col-list input:checked")].map(cb => cb.value));
  const selectedMonths = new Set([...document.querySelectorAll("#month-list .month-items input:checked")].map(cb => cb.value));
  selectedCols.add(dateCol);

  const colIndices = [];
  const filteredCols = [];
  preview.columns.forEach((col, i) => {
    if (selectedCols.has(col)) { colIndices.push(i); filteredCols.push(col); }
  });

  const dateIdx = preview.columns.indexOf(dateCol);
  let filteredRows = preview.data;
  if (selectedMonths.size > 0 && dateIdx >= 0) {
    filteredRows = preview.data.filter(row => {
      const d = row[dateIdx];
      if (!d) return false;
      return selectedMonths.has(String(d).substring(0, 7));
    });
  }

  const table = document.getElementById("preview-table");
  const html = ['<thead><tr>'];
  filteredCols.forEach(col => html.push(`<th>${col}</th>`));
  html.push('</tr></thead><tbody>');
  filteredRows.forEach(row => {
    html.push('<tr>');
    colIndices.forEach(i => html.push(`<td>${row[i] === null ? '' : row[i]}</td>`));
    html.push('</tr>');
  });
  html.push('</tbody>');
  table.innerHTML = html.join('');
}

document.getElementById("cols-select-all").onclick = () => {
  document.querySelectorAll("#col-list input[type=checkbox]").forEach(cb => cb.checked = true);
  updatePreview();
};
document.getElementById("cols-clear").onclick = () => {
  document.querySelectorAll("#col-list input[type=checkbox]").forEach(cb => cb.checked = false);
  updatePreview();
};
document.getElementById("months-select-all").onclick = () => {
  document.querySelectorAll("#month-list input[type=checkbox]").forEach(cb => { cb.checked = true; cb.indeterminate = false; });
  updatePreview();
};
document.getElementById("months-clear").onclick = () => {
  document.querySelectorAll("#month-list input[type=checkbox]").forEach(cb => { cb.checked = false; cb.indeterminate = false; });
  updatePreview();
};

// Back to homepage
document.getElementById("btn-back-home").onclick = () => {
  if (state.wizardFrom === "visualiser") {
    state.wizardFrom = null;
    showView("visualiser");
  } else {
    showView("home");
    renderHomepage();
  }
};

// Ingest button
document.getElementById("btn-ingest").onclick = () => {
  const selectedCols = [...document.querySelectorAll("#col-list input:checked")].map(cb => cb.value);
  const selectedMonths = [...document.querySelectorAll("#month-list .month-items input:checked")].map(cb => cb.value);
  const eventCols = "";

  if (selectedCols.length === 0) { alert("Please select at least one column."); return; }
  if (selectedMonths.length === 0) { alert("Please select at least one date period."); return; }

  showLoading("Loading selected data…");
  fetch("/api/ingest", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sid: state.scanData && state.scanData.sid, columns: selectedCols, months: selectedMonths, event_cols: "" }),
  })
    .then(r => r.json())
    .then(data => {
      hideLoading();
      if (data.error) { alert(data.error); return; }
      state.groups = data.groups;

      // Save to memory
      saveSession(state.currentFile, { sid: state.scanData && state.scanData.sid, columns: selectedCols, months: selectedMonths, eventCols });

      document.getElementById("row-count").textContent = `${data.row_count.toLocaleString()} rows`;
      buildSidebar(data.groups);
      showView("visualiser");
    })
    .catch(err => { hideLoading(); alert("Ingest failed: " + err); });
};

// ── Sidebar ─────────────────────────────────────────────────────────
document.getElementById("btn-toggle-sidebar").onclick = function() {
  const sb = document.getElementById("sidebar");
  sb.classList.toggle("collapsed");
  this.textContent = sb.classList.contains("collapsed") ? "▶" : "◀";
};

// Use ResizeObserver for smooth width-only resize (preserve explicit height)
const chartResizeObserver = new ResizeObserver(() => {
  const chartDiv = document.getElementById("chart");
  if (chartDiv && chartDiv.data) {
    Plotly.relayout(chartDiv, { width: chartDiv.clientWidth - 16 });
  }
});
chartResizeObserver.observe(document.getElementById("chart"));

function buildSidebar(groups) {
  const sb = document.getElementById("sidebar");
  const toggleBtn = document.getElementById("btn-toggle-sidebar");
  sb.innerHTML = "";
  sb.appendChild(toggleBtn); // Keep toggle button
  for (const [group, cols] of Object.entries(groups)) {
    const details = document.createElement("details");
    details.className = "col-group";
    details.open = true;
    const summary = document.createElement("summary");
    summary.textContent = group;
    details.appendChild(summary);

    const btns = document.createElement("div");
    btns.className = "group-btns";
    const selAll = document.createElement("button");
    selAll.textContent = "Select all";
    selAll.onclick = () => { details.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = true); fetchFigure(); };
    const clr = document.createElement("button");
    clr.textContent = "Clear";
    clr.onclick = () => { details.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = false); fetchFigure(); };
    btns.append(selAll, clr);
    details.appendChild(btns);

    for (const col of cols) {
      const lbl = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.value = col; cb.name = "col";
      cb.addEventListener("change", fetchFigure);
      lbl.append(cb, " " + col);
      details.appendChild(lbl);
    }
    sb.appendChild(details);
  }
}

// ── Toolbar ─────────────────────────────────────────────────────────
function setPeriod(p) {
  state.period = p;
  document.querySelectorAll("#btn-weekly,#btn-monthly,#btn-yearly").forEach(b => b.classList.remove("active"));
  document.getElementById("btn-" + p.toLowerCase()).classList.add("active");
}

document.getElementById("btn-weekly").onclick = () => { setPeriod("Weekly"); fetchFigure(); };
document.getElementById("btn-monthly").onclick = () => { setPeriod("Monthly"); fetchFigure(); };
document.getElementById("btn-yearly").onclick = () => { setPeriod("Yearly"); fetchFigure(); };

document.getElementById("btn-normalise").onclick = function () {
  state.normalised = !state.normalised;
  this.textContent = state.normalised ? "Show raw" : "Show normalised";
  this.classList.toggle("active", state.normalised);
  fetchFigure();
};

document.getElementById("y-axis-cap").addEventListener("change", fetchFigure);
document.getElementById("y-axis-cap-neg").addEventListener("change", fetchFigure);



// Edit selection: go back to wizard with current scanData and restore current selections
document.getElementById("btn-edit-selection").onclick = () => {
  if (!state.scanData) return;
  state.wizardFrom = "visualiser";
  const entry = getMemory().find(e => e.filename === state.currentFile);
  showWizardWithRestore(state.scanData, entry);
};

// Home button
document.getElementById("btn-home").onclick = () => { showView("home"); renderHomepage(); };

// ── Fetch figure ────────────────────────────────────────────────────
function getSelectedCols() {
  return [...document.querySelectorAll('#sidebar input[type=checkbox]:checked')].map(cb => cb.value);
}

function fetchFigure() {
  const cols = getSelectedCols();
  showLoading("Generating chart…");
  fetch("/api/figure", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ period: state.period, normalised: state.normalised, selected_cols: cols }),
  })
    .then(r => r.json())
    .then(fig => {
      hideLoading();
      if (fig.error) { alert(fig.error); return; }
      const layout = Object.assign({}, fig.layout, {
        paper_bgcolor: DARK_PLOTLY_LAYOUT.paper_bgcolor,
        plot_bgcolor: DARK_PLOTLY_LAYOUT.plot_bgcolor,
        font: DARK_PLOTLY_LAYOUT.font,
      });
      for (const key of Object.keys(layout)) {
        if (key.startsWith("xaxis")) {
          layout[key] = Object.assign({}, layout[key], { gridcolor: '#30363d', zerolinecolor: '#30363d',
                                                          tickfont: { color: '#8b949e', size: 10 } });
          if (layout[key].title) layout[key].title.font = { color: '#8b949e', size: 12 };
        }
        if (key.startsWith("yaxis")) {
          layout[key] = Object.assign({}, layout[key], { gridcolor: '#30363d',
                                                          zerolinecolor: '#e74c3c', zerolinewidth: 1.5,
                                                          zeroline: true,
                                                          tickfont: { color: '#8b949e', size: 10 } });
          if (layout[key].title) layout[key].title.font = { color: '#8b949e', size: 12 };
        }
      }
      if (layout.title) layout.title.font = { color: '#e6edf3', size: 14 };

      // Apply Y axis caps if set
      const yCapPos = parseFloat(document.getElementById("y-axis-cap").value);
      const yCapNeg = parseFloat(document.getElementById("y-axis-cap-neg").value);
      const hasPos = !isNaN(yCapPos) && yCapPos > 0;
      const hasNeg = !isNaN(yCapNeg) && yCapNeg > 0;
      if (hasPos || hasNeg) {
        for (const key of Object.keys(layout)) {
          if (key.startsWith("yaxis")) {
            const lo = hasNeg ? -yCapNeg : undefined;
            const hi = hasPos ? yCapPos : undefined;
            const range = [lo !== undefined ? lo : (layout[key].range ? layout[key].range[0] : undefined),
                           hi !== undefined ? hi : (layout[key].range ? layout[key].range[1] : undefined)];
            if (range[0] !== undefined && range[1] !== undefined) {
              layout[key] = Object.assign({}, layout[key], { range });
            }
          }
        }
      }

      // Add red dotted zero lines for each subplot
      const shapes = layout.shapes ? [...layout.shapes] : [];
      for (const key of Object.keys(layout)) {
        if (key.startsWith("yaxis")) {
          const idx = key === "yaxis" ? "" : key.replace("yaxis", "");
          shapes.push({
            type: "line", xref: "x" + idx + " domain", yref: key.replace("axis", ""),
            x0: 0, x1: 1, y0: 0, y1: 0,
            line: { color: "#ff0000", width: 0.8, dash: "dashdot" },
          });
        }
      }
      layout.shapes = shapes;

      const chartDiv = document.getElementById("chart");
      chartDiv.innerHTML = "";
      // Use the figure's height if it's larger (for multi-subplot views like weekly)
      const figHeight = layout.height || 500;
      layout.height = Math.max(500, figHeight);
      Plotly.newPlot(chartDiv, fig.data, layout, { responsive: false });
    })
    .catch(err => { hideLoading(); console.error("Figure fetch failed:", err); });
}

// ── Init ────────────────────────────────────────────────────────────
renderHomepage();
showView("home");
