<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Analyser</title>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #1c2128;
      --bg-card: #1c2128;
      --border: #30363d;
      --border-highlight: #58a6ff;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --green-bg: #0d2818;
      --green-border: #238636;
      --red: #f85149;
      --orange: #d29922;
      --purple: #a371f7;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
           background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; }
    .container { max-width: 100%; margin: 0 auto; padding: 16px; overflow-x: hidden; }
    .hidden { display: none !important; }

    /* Header */
    .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
                  padding: 6px 0; border-bottom: 1px solid var(--border); height: 32px; }
    .app-header .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; text-transform: uppercase;
                            letter-spacing: 1px; }

    /* Wizard */
    .wizard { max-width: 1000px; margin: 0 auto; }
    .wizard-step { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
                   padding: 24px; margin-bottom: 16px; }
    .wizard-step h2 { font-size: 1rem; margin-bottom: 14px; color: var(--text-primary); font-weight: 600; }
    .wizard-step .step-num { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center;
                             background: var(--accent); color: var(--bg-primary); border-radius: 50%;
                             font-size: 0.75rem; font-weight: 700; margin-right: 8px; }
    .wizard-step.disabled { opacity: 0.35; pointer-events: none; }

    /* Upload area */
    .upload-area { border: 1px dashed var(--border); border-radius: 6px; padding: 40px; text-align: center;
                   cursor: pointer; transition: border-color 0.15s; background: var(--bg-secondary); }
    .upload-area:hover { border-color: var(--accent); }
    .upload-area input[type=file] { display: none; }
    .upload-area label { cursor: pointer; font-size: 0.95rem; color: var(--text-secondary); }
    .upload-area label strong { color: var(--accent); }
    .upload-success { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                      background: var(--green-bg); border: 1px solid var(--green-border);
                      border-radius: 6px; font-size: 0.85rem; color: var(--green); }
    .upload-success .file-info { font-weight: 600; color: var(--text-primary); }

    /* Selection panels */
    .select-panels { display: flex; gap: 16px; flex-wrap: wrap; }
    .select-panel { flex: 1; min-width: 280px; }
    .select-panel h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary);
                       text-transform: uppercase; letter-spacing: 0.5px; }
    .select-panel .panel-actions { display: flex; gap: 6px; margin-bottom: 6px; }
    .select-panel .panel-actions button { font-size: 0.7rem; padding: 3px 10px; border: 1px solid var(--border);
                                          border-radius: 4px; background: var(--bg-secondary); color: var(--text-secondary);
                                          cursor: pointer; transition: all 0.15s; }
    .select-panel .panel-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .select-list { max-height: 350px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px;
                   padding: 4px; background: var(--bg-secondary); }
    .select-list label { display: block; padding: 4px 8px; font-size: 0.8rem; cursor: pointer; border-radius: 3px;
                         color: var(--text-secondary); transition: background 0.1s; }
    .select-list label:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .select-list input[type=checkbox] { margin-right: 8px; accent-color: var(--accent); }

    /* Config row */
    .config-row { margin-top: 16px; }
    .config-row label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px;
                        color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .config-row input[type=text] { width: 100%; max-width: 500px; padding: 8px 12px; border: 1px solid var(--border);
                                   border-radius: 4px; font-size: 0.85rem; background: var(--bg-secondary);
                                   color: var(--text-primary); transition: border-color 0.15s; }
    .config-row input[type=text]:focus { outline: none; border-color: var(--accent); }

    /* Preview table */
    .preview-wrap { overflow-x: auto; margin-top: 16px; }
    .preview-wrap h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary);
                       text-transform: uppercase; letter-spacing: 0.5px; }
    .preview-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    .preview-table th, .preview-table td { padding: 6px 10px; border: 1px solid var(--border);
                                           text-align: left; white-space: nowrap; }
    .preview-table th { background: var(--bg-tertiary); font-weight: 600; color: var(--text-secondary);
                        position: sticky; top: 0; }
    .preview-table td { color: var(--text-primary); }
    .preview-table tr:nth-child(even) td { background: rgba(56,139,253,0.02); }

    /* Buttons */
    .wizard-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
    .btn { padding: 8px 18px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-secondary);
           cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); transition: all 0.15s; }
    .btn:hover { border-color: var(--text-muted); color: var(--text-primary); }
    .btn-go { background: var(--green-border); color: #fff; border-color: var(--green-border);
              font-weight: 600; font-size: 0.9rem; padding: 10px 24px; }
    .btn-go:hover { background: var(--green); }

    /* Memory / Recent sessions */
    .recent-sessions { margin-bottom: 16px; }
    .recent-sessions h3 { font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; color: var(--text-secondary);
                          text-transform: uppercase; letter-spacing: 0.5px; }
    .recent-list { display: flex; flex-direction: column; gap: 6px; }
    .recent-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
                   background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px;
                   cursor: pointer; transition: border-color 0.15s; }
    .recent-item:hover { border-color: var(--accent); }
    .recent-item .ri-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
    .recent-item .ri-meta { font-size: 0.72rem; color: var(--text-muted); }
    .recent-item .ri-delete { margin-left: auto; font-size: 0.7rem; color: var(--text-muted);
                              cursor: pointer; padding: 2px 6px; border-radius: 3px; }
    .recent-item .ri-delete:hover { background: rgba(248,81,73,0.15); color: #f85149; }

    /* Toolbar */
    .toolbar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; align-items: center;
               padding: 10px 14px; background: var(--bg-secondary); border: 1px solid var(--border);
               border-radius: 6px; }
    .toolbar button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 4px;
                      background: var(--bg-tertiary); cursor: pointer; font-size: 0.82rem;
                      color: var(--text-secondary); transition: all 0.15s; }
    .toolbar button:hover { border-color: var(--accent); color: var(--accent); }
    .toolbar button.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent);
                             font-weight: 600; }
    .toolbar button.primary { background: var(--green-border); color: #fff; border-color: var(--green-border);
                              font-weight: 700; font-size: 0.88rem; padding: 8px 20px; }
    .toolbar button.primary:hover { background: var(--green); border-color: var(--green); }

    /* Main layout */
    .main { display: flex; gap: 10px; align-items: flex-start; overflow: hidden; }
    .sidebar { width: 300px; min-width: 0; max-height: 85vh; overflow-y: auto;
               background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px;
               padding: 10px; flex-shrink: 0; transition: width 0.2s, padding 0.2s, opacity 0.2s; }
    .sidebar.collapsed { width: 0; padding: 0; border: none; opacity: 0; overflow: hidden; }
    .sidebar details { margin-bottom: 4px; }
    .sidebar summary { cursor: pointer; font-weight: 600; padding: 6px 4px; font-size: 0.82rem;
                       color: var(--text-secondary); border-radius: 3px; }
    .sidebar summary:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .sidebar .group-btns { display: flex; gap: 4px; margin: 4px 0 4px 8px; }
    .sidebar .group-btns button { font-size: 0.7rem; padding: 2px 8px; border: 1px solid var(--border);
                                   border-radius: 3px; background: var(--bg-tertiary); color: var(--text-muted);
                                   cursor: pointer; }
    .sidebar .group-btns button:hover { color: var(--accent); border-color: var(--accent); }
    .sidebar label { display: block; padding: 3px 4px 3px 12px; font-size: 0.8rem; cursor: pointer;
                     color: var(--text-secondary); border-radius: 3px; }
    .sidebar label:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .sidebar input[type=checkbox] { margin-right: 6px; accent-color: var(--accent); }
    .toggle-sidebar { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px;
                      padding: 6px 10px; cursor: pointer; font-size: 0.9rem; align-self: flex-start;
                      flex-shrink: 0; color: var(--text-secondary); transition: all 0.15s; }
    .toggle-sidebar:hover { color: var(--accent); border-color: var(--accent); }

    #chart { flex: 1; min-width: 0; overflow-x: auto; max-width: 100%; background: var(--bg-secondary);
             border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
    .placeholder { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 0.95rem; }

    /* Loading indicator */
    .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(13,17,23,0.9);
                       z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    .loading-overlay.visible { display: flex; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent);
               border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay p { margin-top: 14px; font-size: 0.9rem; color: var(--text-secondary); }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
<div class="container">
  <div class="app-header">
    <span class="subtitle">Timeseries Intelligence</span>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Uploading and processing file…</p>
  </div>

  <!-- ═══ WIZARD ═══ -->
  <div class="wizard" id="wizard">

    <!-- Recent sessions (memory) -->
    <div class="recent-sessions hidden" id="recent-sessions">
      <h3>📁 Recent sessions</h3>
      <div class="recent-list" id="recent-list"></div>
    </div>

    <!-- Step 1: Upload -->
    <div class="wizard-step" id="step-upload">
      <h2><span class="step-num">1</span> Upload data file</h2>
      <div class="upload-area" id="upload-area">
        <label for="csv-file">
          <strong>Click to upload</strong> or drag &amp; drop a data file<br>
          <small style="color:var(--text-muted)">Supports CSV, Parquet, and Excel (.xlsx/.xls)</small>
        </label>
        <input type="file" id="csv-file" accept=".csv,.parquet,.parq,.xlsx,.xls">
      </div>
      <div class="upload-success hidden" id="upload-success">
        <span>✓</span>
        <span class="file-info" id="upload-file-info"></span>
        <button class="btn" id="btn-change-file" style="margin-left:auto;font-size:.75rem;">Change file</button>
      </div>
    </div>

    <!-- Step 2: Select columns & date periods -->
    <div class="wizard-step disabled" id="step-select">
      <h2><span class="step-num">2</span> Select columns &amp; date range to ingest</h2>

      <div class="select-panels">
        <div class="select-panel">
          <h3>Columns</h3>
          <div class="panel-actions">
            <button id="cols-select-all">Select all</button>
            <button id="cols-clear">Clear</button>
          </div>
          <div class="select-list" id="col-list"></div>
        </div>
        <div class="select-panel">
          <h3>Date periods (months)</h3>
          <div class="panel-actions">
            <button id="months-select-all">Select all</button>
            <button id="months-clear">Clear</button>
          </div>
          <div class="select-list" id="month-list"></div>
        </div>
      </div>

      <div class="config-row">
        <label for="event-cols">Event columns <small style="text-transform:none;letter-spacing:0">(comma-separated, optional)</small></label>
        <input type="text" id="event-cols">
      </div>

      <div class="preview-wrap">
        <h3>Preview (first 10 rows)</h3>
        <table class="preview-table" id="preview-table"></table>
      </div>

      <div class="wizard-actions">
        <button class="btn-go" id="btn-ingest">Load selected data →</button>
      </div>
    </div>
  </div>

  <!-- ═══ VISUALISER ═══ -->
  <div class="toolbar hidden" id="toolbar">
    <button id="btn-weekly">Weekly</button>
    <button id="btn-monthly">Monthly</button>
    <button id="btn-yearly" class="active">Yearly</button>
    <button id="btn-normalise">Show normalised</button>
    <button id="btn-apply" class="primary">⚡ Apply selection</button>
    <span id="row-count" style="margin-left:12px;font-size:.8rem;color:var(--text-muted);font-weight:600"></span>
    <span id="file-label" style="margin-left:auto;font-size:.8rem;color:var(--text-muted)"></span>
    <button id="btn-new-file" style="margin-left:8px;font-size:.75rem;padding:4px 10px;">↩ New file</button>
  </div>

  <div class="main hidden" id="main-area">
    <button class="toggle-sidebar" id="btn-toggle-sidebar" title="Toggle sidebar">◀</button>
    <div class="sidebar" id="sidebar"></div>
    <div id="chart">
      <div class="placeholder">Select columns from the sidebar and click <strong>⚡ Apply selection</strong></div>
    </div>
  </div>
</div>

<script>
const DARK_PLOTLY_LAYOUT = {
  paper_bgcolor: '#1c2128',
  plot_bgcolor: '#161b22',
  font: { color: '#8b949e', size: 11 },
  xaxis: { gridcolor: '#30363d', zerolinecolor: '#30363d' },
  yaxis: { gridcolor: '#30363d', zerolinecolor: '#30363d' },
};

const state = { period: "Yearly", normalised: false, groups: null, scanData: null };

// ── Memory (localStorage) ───────────────────────────────────────────
const MEMORY_KEY = "signal_analyser_sessions";
function getMemory() {
  try { return JSON.parse(localStorage.getItem(MEMORY_KEY) || "[]"); }
  catch { return []; }
}
function saveMemory(entries) {
  localStorage.setItem(MEMORY_KEY, JSON.stringify(entries.slice(0, 20))); // Keep last 20
}
function saveSession(filename, config) {
  const entries = getMemory();
  // Remove duplicate for same filename
  const filtered = entries.filter(e => e.filename !== filename);
  filtered.unshift({
    filename,
    columns: config.columns,
    months: config.months,
    eventCols: config.eventCols || "",
    savedAt: new Date().toISOString(),
  });
  saveMemory(filtered);
  renderRecentSessions();
}
function renderRecentSessions() {
  const entries = getMemory();
  const container = document.getElementById("recent-sessions");
  const list = document.getElementById("recent-list");
  if (entries.length === 0) { container.classList.add("hidden"); return; }
  container.classList.remove("hidden");
  list.innerHTML = "";
  entries.forEach((entry, idx) => {
    const div = document.createElement("div");
    div.className = "recent-item";
    const ago = timeAgo(entry.savedAt);
    const colCount = entry.columns ? entry.columns.length : 0;
    const monthCount = entry.months ? entry.months.length : 0;
    div.innerHTML = `
      <div>
        <div class="ri-name">${entry.filename}</div>
        <div class="ri-meta">${colCount} cols · ${monthCount} months · ${ago}</div>
      </div>
      <span class="ri-delete" data-idx="${idx}" title="Remove">✕</span>
    `;
    div.addEventListener("click", (e) => {
      if (e.target.classList.contains("ri-delete")) return;
      loadFromMemory(entry);
    });
    div.querySelector(".ri-delete").addEventListener("click", (e) => {
      e.stopPropagation();
      const mem = getMemory();
      mem.splice(idx, 1);
      saveMemory(mem);
      renderRecentSessions();
    });
    list.appendChild(div);
  });
}
function timeAgo(isoStr) {
  const diff = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  const days = Math.floor(hrs / 24);
  return days + "d ago";
}
function loadFromMemory(entry) {
  // Restore the saved config into state so after upload we can re-apply selections
  state.memoryRestore = entry;
  // Prompt user to re-upload the same file
  alert(`Please upload "${entry.filename}" again.\nYour previous column & date selections will be restored automatically.`);
}
function applyMemoryRestore() {
  // After upload, if we have a memory restore pending, apply the selections
  const restore = state.memoryRestore;
  if (!restore) return false;
  state.memoryRestore = null;

  // Apply column selections
  const colSet = new Set(restore.columns || []);
  document.querySelectorAll("#col-list input[type=checkbox]").forEach(cb => {
    cb.checked = colSet.has(cb.value);
  });
  // Apply month selections
  const monthSet = new Set(restore.months || []);
  document.querySelectorAll("#month-list input[type=checkbox]").forEach(cb => {
    cb.checked = monthSet.has(cb.value);
  });
  // Apply event cols
  if (restore.eventCols) {
    document.getElementById("event-cols").value = restore.eventCols;
  }
  updatePreview();
  return true;
}
// Render on page load
renderRecentSessions();

function showLoading(msg) { document.getElementById("loading-text").textContent = msg; document.getElementById("loading").classList.add("visible"); }
function hideLoading() { document.getElementById("loading").classList.remove("visible"); }

// ── Wizard Step 1: Upload ───────────────────────────────────────────
const uploadArea = document.getElementById("upload-area");
const csvInput = document.getElementById("csv-file");

uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.style.borderColor = "var(--accent)"; });
uploadArea.addEventListener("dragleave", () => { uploadArea.style.borderColor = ""; });
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.style.borderColor = "";
  if (e.dataTransfer.files.length) { csvInput.files = e.dataTransfer.files; handleUpload(); }
});
csvInput.addEventListener("change", handleUpload);

document.getElementById("btn-change-file").onclick = () => {
  uploadArea.classList.remove("hidden");
  document.getElementById("upload-success").classList.add("hidden");
  document.getElementById("step-select").classList.add("disabled");
  csvInput.value = "";
};

function handleUpload() {
  const file = csvInput.files[0];
  if (!file) return;
  showLoading("Scanning file…");
  const fd = new FormData();
  fd.append("file", file);

  fetch("/api/upload", { method: "POST", body: fd })
    .then(r => r.json())
    .then(data => {
      hideLoading();
      if (data.error) { alert(data.error); return; }
      state.scanData = data;

      uploadArea.classList.add("hidden");
      document.getElementById("upload-success").classList.remove("hidden");
      document.getElementById("upload-file-info").textContent =
        `${file.name} — ${data.row_count.toLocaleString()} rows × ${data.col_count} columns`;

      document.getElementById("step-select").classList.remove("disabled");
      buildColumnList(data.columns);
      buildMonthList(data.months);
      applyMemoryRestore(); // Restore saved selections if loading from memory
      buildPreviewTable(data.preview);
    })
    .catch(err => { hideLoading(); alert("Upload failed: " + err); });
}

// ── Wizard Step 2: Column & Month selection ─────────────────────────
function buildColumnList(columns) {
  const list = document.getElementById("col-list");
  // Use DocumentFragment for fast DOM insertion
  const frag = document.createDocumentFragment();
  columns.forEach(col => {
    const lbl = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.value = col; cb.checked = true;
    cb.addEventListener("change", updatePreview);
    lbl.append(cb, " " + col);
    frag.appendChild(lbl);
  });
  list.innerHTML = "";
  list.appendChild(frag);
}

function buildMonthList(months) {
  const list = document.getElementById("month-list");
  const frag = document.createDocumentFragment();
  months.forEach(m => {
    const lbl = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.value = m; cb.checked = false; // Unticked by default
    cb.addEventListener("change", updatePreview);
    lbl.append(cb, " " + m);
    frag.appendChild(lbl);
  });
  list.innerHTML = "";
  list.appendChild(frag);
}

function updatePreview() {
  if (!state.scanData) return;
  const preview = state.scanData.preview;
  const dateCcol = state.scanData.date_col;
  const selectedCols = new Set([...document.querySelectorAll("#col-list input:checked")].map(cb => cb.value));
  const selectedMonths = new Set([...document.querySelectorAll("#month-list input:checked")].map(cb => cb.value));
  selectedCols.add(dateCcol); // Always show date col

  // Filter columns
  const colIndices = [];
  const filteredCols = [];
  preview.columns.forEach((col, i) => {
    if (selectedCols.has(col)) { colIndices.push(i); filteredCols.push(col); }
  });

  // Filter rows by selected months
  const dateIdx = preview.columns.indexOf(dateCcol);
  let filteredRows = preview.data;
  if (selectedMonths.size > 0 && dateIdx >= 0) {
    filteredRows = preview.data.filter(row => {
      const d = row[dateIdx];
      if (!d) return false;
      // Match YYYY-MM format
      const m = String(d).substring(0, 7);
      return selectedMonths.has(m);
    });
  }

  // Render filtered preview
  const table = document.getElementById("preview-table");
  const html = ['<thead><tr>'];
  filteredCols.forEach(col => html.push(`<th>${col}</th>`));
  html.push('</tr></thead><tbody>');
  filteredRows.forEach(row => {
    html.push('<tr>');
    colIndices.forEach(i => html.push(`<td>${row[i] === null ? '' : row[i]}</td>`));
    html.push('</tr>');
  });
  html.push('</tbody>');
  table.innerHTML = html.join('');
}

function buildPreviewTable(preview) {
  updatePreview();
}

document.getElementById("cols-select-all").onclick = () => {
  document.querySelectorAll("#col-list input[type=checkbox]").forEach(cb => cb.checked = true);
  updatePreview();
};
document.getElementById("cols-clear").onclick = () => {
  document.querySelectorAll("#col-list input[type=checkbox]").forEach(cb => cb.checked = false);
  updatePreview();
};
document.getElementById("months-select-all").onclick = () => {
  document.querySelectorAll("#month-list input[type=checkbox]").forEach(cb => cb.checked = true);
  updatePreview();
};
document.getElementById("months-clear").onclick = () => {
  document.querySelectorAll("#month-list input[type=checkbox]").forEach(cb => cb.checked = false);
  updatePreview();
};

// Ingest button
document.getElementById("btn-ingest").onclick = () => {
  const selectedCols = [...document.querySelectorAll("#col-list input:checked")].map(cb => cb.value);
  const selectedMonths = [...document.querySelectorAll("#month-list input:checked")].map(cb => cb.value);
  const eventCols = document.getElementById("event-cols").value;

  if (selectedCols.length === 0) { alert("Please select at least one column."); return; }
  if (selectedMonths.length === 0) { alert("Please select at least one date period."); return; }

  showLoading("Loading selected data…");
  fetch("/api/ingest", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ columns: selectedCols, months: selectedMonths, event_cols: eventCols }),
  })
    .then(r => r.json())
    .then(data => {
      hideLoading();
      if (data.error) { alert(data.error); return; }
      state.groups = data.groups;

      // Save to memory
      const filename = document.getElementById("upload-file-info").textContent.split("—")[0].trim();
      saveSession(filename, { columns: selectedCols, months: selectedMonths, eventCols });

      document.getElementById("row-count").textContent = `${data.row_count.toLocaleString()} rows`;
      document.getElementById("file-label").textContent = document.getElementById("upload-file-info").textContent;
      buildSidebar(data.groups);

      document.getElementById("wizard").classList.add("hidden");
      document.getElementById("toolbar").classList.remove("hidden");
      document.getElementById("main-area").classList.remove("hidden");
    })
    .catch(err => { hideLoading(); alert("Ingest failed: " + err); });
};

// ── Sidebar ─────────────────────────────────────────────────────────
document.getElementById("btn-toggle-sidebar").onclick = function() {
  const sb = document.getElementById("sidebar");
  sb.classList.toggle("collapsed");
  this.textContent = sb.classList.contains("collapsed") ? "▶" : "◀";
  setTimeout(() => {
    const chartDiv = document.getElementById("chart");
    if (chartDiv.data) Plotly.Plots.resize(chartDiv);
  }, 250);
};

function buildSidebar(groups) {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  for (const [group, cols] of Object.entries(groups)) {
    const details = document.createElement("details");
    details.className = "col-group";
    const summary = document.createElement("summary");
    summary.textContent = group;
    details.appendChild(summary);

    const btns = document.createElement("div");
    btns.className = "group-btns";
    const selAll = document.createElement("button");
    selAll.textContent = "Select all";
    selAll.onclick = () => details.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = true);
    const clr = document.createElement("button");
    clr.textContent = "Clear";
    clr.onclick = () => details.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = false);
    btns.append(selAll, clr);
    details.appendChild(btns);

    for (const col of cols) {
      const lbl = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.value = col; cb.name = "col";
      lbl.append(cb, " " + col);
      details.appendChild(lbl);
    }
    sb.appendChild(details);
  }
}

// ── Toolbar ─────────────────────────────────────────────────────────
function setPeriod(p) {
  state.period = p;
  document.querySelectorAll("#btn-weekly,#btn-monthly,#btn-yearly").forEach(b => b.classList.remove("active"));
  document.getElementById("btn-" + p.toLowerCase()).classList.add("active");
}

document.getElementById("btn-weekly").onclick = () => { setPeriod("Weekly"); fetchFigure(); };
document.getElementById("btn-monthly").onclick = () => { setPeriod("Monthly"); fetchFigure(); };
document.getElementById("btn-yearly").onclick = () => { setPeriod("Yearly"); fetchFigure(); };

document.getElementById("btn-normalise").onclick = function () {
  state.normalised = !state.normalised;
  this.textContent = state.normalised ? "Show raw" : "Show normalised";
  this.classList.toggle("active", state.normalised);
  fetchFigure();
};

document.getElementById("btn-apply").onclick = () => fetchFigure();

document.getElementById("btn-new-file").onclick = () => {
  document.getElementById("wizard").classList.remove("hidden");
  document.getElementById("toolbar").classList.add("hidden");
  document.getElementById("main-area").classList.add("hidden");
  uploadArea.classList.remove("hidden");
  document.getElementById("upload-success").classList.add("hidden");
  document.getElementById("step-select").classList.add("disabled");
  csvInput.value = "";
  state.scanData = null;
};

// ── Fetch figure ────────────────────────────────────────────────────
function getSelectedCols() {
  return [...document.querySelectorAll('#sidebar input[type=checkbox]:checked')].map(cb => cb.value);
}

function fetchFigure() {
  const cols = getSelectedCols();
  showLoading("Generating chart…");
  fetch("/api/figure", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ period: state.period, normalised: state.normalised, selected_cols: cols }),
  })
    .then(r => r.json())
    .then(fig => {
      hideLoading();
      if (fig.error) { alert(fig.error); return; }
      // Apply dark theme to all axes
      const layout = Object.assign({}, fig.layout, {
        paper_bgcolor: DARK_PLOTLY_LAYOUT.paper_bgcolor,
        plot_bgcolor: DARK_PLOTLY_LAYOUT.plot_bgcolor,
        font: DARK_PLOTLY_LAYOUT.font,
      });
      // Style all x/y axes
      for (const key of Object.keys(layout)) {
        if (key.startsWith("xaxis") || key.startsWith("yaxis")) {
          layout[key] = Object.assign({}, layout[key], { gridcolor: '#30363d', zerolinecolor: '#30363d',
                                                          tickfont: { color: '#8b949e', size: 10 } });
          if (layout[key].title) layout[key].title.font = { color: '#8b949e', size: 12 };
        }
      }
      if (layout.title) layout.title.font = { color: '#e6edf3', size: 14 };

      const chartDiv = document.getElementById("chart");
      chartDiv.innerHTML = "";
      Plotly.newPlot(chartDiv, fig.data, layout, { responsive: true });
    })
    .catch(err => { hideLoading(); console.error("Figure fetch failed:", err); });
}
</script>
