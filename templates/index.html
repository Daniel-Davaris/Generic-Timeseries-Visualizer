<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeseries Visualiser</title>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f6fa; color: #222; }
    .container { max-width: 100%; margin: 0 auto; padding: 16px; overflow-x: hidden; }
    h1 { font-size: 1.4rem; margin-bottom: 12px; }

    /* Upload area */
    .upload-area { background: #fff; border: 2px dashed #bbb; border-radius: 8px;
                   padding: 32px; text-align: center; margin-bottom: 16px; cursor: pointer; }
    .upload-area:hover { border-color: #636EFA; }
    .upload-area.hidden { display: none; }
    .upload-area input[type=file] { display: none; }
    .upload-area label { cursor: pointer; font-size: 1.1rem; color: #555; }
    .upload-area label strong { color: #636EFA; }
    #event-cols-row { margin-top: 10px; font-size: 0.9rem; }
    #event-cols-row input[type=text] { padding: 4px 8px; width: 360px; border: 1px solid #ccc; border-radius: 4px; }

    /* Toolbar */
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .toolbar button { padding: 6px 16px; border: 1px solid #ccc; border-radius: 4px;
                      background: #fff; cursor: pointer; font-size: 0.9rem; }
    .toolbar button:hover { background: #e8e8e8; }
    .toolbar button.active { background: #636EFA; color: #fff; border-color: #636EFA; }
    .toolbar button.primary { background: #00CC96; color: #fff; border-color: #00CC96;
                              font-weight: 700; font-size: 0.95rem; padding: 8px 22px; }
    .toolbar button.primary:hover { background: #00b386; border-color: #00b386; }

    /* Main layout */
    .main { display: flex; gap: 12px; align-items: flex-start; overflow: hidden; }
    .sidebar { width: 340px; min-width: 260px; max-height: 85vh; overflow-y: auto;
               background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 8px; flex-shrink: 0; }
    .sidebar details { margin-bottom: 6px; }
    .sidebar summary { cursor: pointer; font-weight: 600; padding: 4px; }
    .sidebar .group-btns { display: flex; gap: 4px; margin: 4px 0; }
    .sidebar .group-btns button { font-size: 0.75rem; padding: 2px 8px; border: 1px solid #ccc;
                                   border-radius: 3px; background: #f9f9f9; cursor: pointer; }
    .sidebar label { display: block; padding: 2px 0; font-size: 0.85rem; cursor: pointer; }
    .sidebar input[type=checkbox] { margin-right: 6px; }

    #chart { flex: 1; min-width: 0; overflow-x: auto; max-width: 100%; }
    .placeholder { text-align: center; color: #999; padding: 60px 20px; font-size: 1.1rem; }

    /* Loading indicator */
    .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.85);
                       z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    .loading-overlay.visible { display: flex; }
    .spinner { width: 48px; height: 48px; border: 4px solid #e0e0e0; border-top-color: #636EFA;
               border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay p { margin-top: 14px; font-size: 1rem; color: #555; }
  </style>
</head>
<body>
<div class="container">
  <h1>📈 Timeseries Visualiser</h1>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <p id="loading-text">Uploading and processing file…</p>
  </div>

  <!-- Upload -->
  <div class="upload-area" id="upload-area">
    <label for="csv-file">
      <strong>Click to upload</strong> or drag &amp; drop a data file<br>
      <small>Supports CSV, Parquet, and Excel (.xlsx/.xls) — must contain a date column</small>
    </label>
    <input type="file" id="csv-file" accept=".csv,.parquet,.parq,.xlsx,.xls">
    <div id="event-cols-row">
      <label for="event-cols">Event columns <small>(comma-separated, optional)</small>:</label>
      <input type="text" id="event-cols" placeholder="e.g. input_ToU_label, input_Trade_signal, window">
    </div>
  </div>

  <!-- Controls (hidden until data loaded) -->
  <div class="toolbar hidden" id="toolbar">
    <button id="btn-weekly">Weekly</button>
    <button id="btn-monthly">Monthly</button>
    <button id="btn-yearly" class="active">Yearly</button>
    <button id="btn-normalise">Show normalised</button>
    <button id="btn-apply" class="primary">Apply selection</button>
    <span id="row-count" style="margin-left:12px;font-size:.85rem;color:#555;font-weight:600"></span>
    <span id="file-label" style="margin-left:auto;font-size:.85rem;color:#888"></span>
    <button id="btn-new-file" style="margin-left:8px;font-size:.8rem;padding:4px 10px;">📂 New file</button>
  </div>

  <div class="main hidden" id="main-area">
    <div class="sidebar" id="sidebar"></div>
    <div id="chart">
      <div class="placeholder">Select columns from the sidebar and click <strong>Apply selection</strong></div>
    </div>
  </div>
</div>

<script>
const state = { period: "Yearly", normalised: false, groups: null };

// ── Upload ──────────────────────────────────────────────────────────
const uploadArea = document.getElementById("upload-area");
const csvInput = document.getElementById("csv-file");

uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.style.borderColor = "#636EFA"; });
uploadArea.addEventListener("dragleave", () => { uploadArea.style.borderColor = "#bbb"; });
uploadArea.addEventListener("drop", e => {
  e.preventDefault();
  uploadArea.style.borderColor = "#bbb";
  if (e.dataTransfer.files.length) { csvInput.files = e.dataTransfer.files; handleUpload(); }
});
csvInput.addEventListener("change", handleUpload);

function showLoading(msg) { document.getElementById("loading-text").textContent = msg; document.getElementById("loading").classList.add("visible"); }
function hideLoading() { document.getElementById("loading").classList.remove("visible"); }

function handleUpload() {
  const file = csvInput.files[0];
  if (!file) return;
  showLoading("Uploading and processing file…");
  const fd = new FormData();
  fd.append("file", file);
  fd.append("event_cols", document.getElementById("event-cols").value);

  fetch("/api/upload", { method: "POST", body: fd })
    .then(r => r.json())
    .then(data => {
      hideLoading();
      if (data.error) { alert(data.error); return; }
      state.groups = data.groups;
      document.getElementById("file-label").textContent = file.name;
      document.getElementById("row-count").textContent = `${data.row_count.toLocaleString()} rows × ${data.col_count} columns`;
      buildSidebar(data.groups);
      uploadArea.classList.add("hidden");
      document.getElementById("toolbar").classList.remove("hidden");
      document.getElementById("main-area").classList.remove("hidden");
    })
    .catch(err => { hideLoading(); alert("Upload failed: " + err); });
}

{% if groups %}
// Pre-loaded dataset
state.groups = {{ groups | tojson }};
document.addEventListener("DOMContentLoaded", () => {
  buildSidebar(state.groups);
  uploadArea.classList.add("hidden");
  document.getElementById("toolbar").classList.remove("hidden");
  document.getElementById("main-area").classList.remove("hidden");
});
{% endif %}

// ── Sidebar ─────────────────────────────────────────────────────────
function buildSidebar(groups) {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  for (const [group, cols] of Object.entries(groups)) {
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = group;
    details.appendChild(summary);

    const btns = document.createElement("div");
    btns.className = "group-btns";
    const selAll = document.createElement("button");
    selAll.textContent = "Select all";
    selAll.onclick = () => details.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = true);
    const clr = document.createElement("button");
    clr.textContent = "Clear";
    clr.onclick = () => details.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = false);
    btns.append(selAll, clr);
    details.appendChild(btns);

    for (const col of cols) {
      const lbl = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.value = col; cb.name = "col";
      lbl.append(cb, " " + col);
      details.appendChild(lbl);
    }
    sb.appendChild(details);
  }
}

// ── Toolbar ─────────────────────────────────────────────────────────
function setPeriod(p) {
  state.period = p;
  document.querySelectorAll("#btn-weekly,#btn-monthly,#btn-yearly").forEach(b => b.classList.remove("active"));
  document.getElementById("btn-" + p.toLowerCase()).classList.add("active");
}

document.getElementById("btn-weekly").onclick = () => { setPeriod("Weekly"); fetchFigure(); };
document.getElementById("btn-monthly").onclick = () => { setPeriod("Monthly"); fetchFigure(); };
document.getElementById("btn-yearly").onclick = () => { setPeriod("Yearly"); fetchFigure(); };

document.getElementById("btn-normalise").onclick = function () {
  state.normalised = !state.normalised;
  this.textContent = state.normalised ? "Show raw" : "Show normalised";
  this.classList.toggle("active", state.normalised);
  fetchFigure();
};

document.getElementById("btn-apply").onclick = () => fetchFigure();

document.getElementById("btn-new-file").onclick = () => {
  uploadArea.classList.remove("hidden");
  document.getElementById("toolbar").classList.add("hidden");
  document.getElementById("main-area").classList.add("hidden");
  csvInput.value = "";
};

// ── Fetch figure ────────────────────────────────────────────────────
function getSelectedCols() {
  return [...document.querySelectorAll('#sidebar input[type=checkbox]:checked')].map(cb => cb.value);
}

function fetchFigure() {
  const cols = getSelectedCols();
  showLoading("Generating chart…");
  fetch("/api/figure", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ period: state.period, normalised: state.normalised, selected_cols: cols }),
  })
    .then(r => r.json())
    .then(fig => {
      hideLoading();
      if (fig.error) { alert(fig.error); return; }
      const chartDiv = document.getElementById("chart");
      chartDiv.innerHTML = "";
      Plotly.newPlot(chartDiv, fig.data, fig.layout, { responsive: true });
    })
    .catch(err => { hideLoading(); console.error("Figure fetch failed:", err); });
}
</script>
</body>
</html>
